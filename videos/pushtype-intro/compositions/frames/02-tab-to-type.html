    <!-- One muted layer of the TYPE recording in the shared 1000x750 window box. The
         assembler hoists it to the host root; the timeline below masks it to the Notes
         window, lifts it and zooms it with the rim. -->
    <!-- approved frame video hoisted by assemble-index -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "02-tab-to-type";
      var PREFIX = "f" + ID + "-";
      var byId = function (name) {
        return document.getElementById(PREFIX + name);
      };
      // The approved video is hoisted to the host root, outside this frame's scoped
      // document, so it is looked up on the real owner document (as frame 1 does).
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var hostDoc = (root && root.ownerDocument) || window.document;
      var hostVideo = function (name) {
        return hostDoc.getElementById(PREFIX + name) || byId(name);
      };

      var words = Array.prototype.slice.call(byId("headline").querySelectorAll("span"));
      var keycap = byId("keycap");
      var rimWindow = byId("rim-window");
      var typeA = hostVideo("type-a");

      // Mask in the 1000x750 video box (design space 1040x780 at 0.9615): the Notes window.
      var MASK_WINDOW = "inset(15.385px 20.192px 99.038px 19.231px round 23.077px)";
      var FOOTAGE_FILTER = "brightness(1.14)";
      // Zoom point design (300, 290) = video-local (288.462, 278.846) = screen (1128.462, 413.846).
      var VIDEO_ORIGIN = "288.462px 278.846px";
      if (typeA) {
        Object.assign(typeA.style, {
          clipPath: MASK_WINDOW,
          filter: FOOTAGE_FILTER,
          transformOrigin: VIDEO_ORIGIN,
        });
      }

      var KEY_REST = { borderColor: "rgba(239,237,232,0.22)", boxShadow: "0 0 0px rgba(255,90,69,0)" };
      var KEY_DOWN = { borderColor: "#FF5A45", boxShadow: "0 0 24px rgba(255,90,69,0.35)" };

      // Footage cue (frame-local seconds): Tab accepts "take".
      var TAB_ACCEPT = 1.67;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.5): "Tab to TYPE." waterfalls into the headline slot word by word.
      tl.fromTo(
        words,
        { y: 24, opacity: 0, filter: "blur(6px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power3.out", stagger: 0.08 },
        0,
      );

      // Scene 2 (0.2-1.1): zoom toward the typed line, video and rim together.
      var ZOOM_AT = 0.2;
      var ZOOM_DUR = 0.9;
      var ZOOM_SCALE = 1.12;
      // Nudge left while zooming so the window keeps ~37px clear of the right edge
      // and ~31px clear of the headline (1.18 cropped the window at the frame edge).
      var ZOOM_SHIFT_X = -20;
      [rimWindow, typeA].forEach(function (target) {
        if (!target) return;
        tl.fromTo(
          target,
          { scale: 1, x: 0 },
          { scale: ZOOM_SCALE, x: ZOOM_SHIFT_X, duration: ZOOM_DUR, ease: "power3.inOut" },
          ZOOM_AT,
        );
      });

      // Scene 3 (1.67-1.95): Tab presses as the footage accepts the gray word, then releases.
      tl.fromTo(
        keycap,
        Object.assign({ scale: 1 }, KEY_REST),
        Object.assign({ scale: 0.94, duration: 0.04, ease: "power2.out", immediateRender: false }, KEY_DOWN),
        TAB_ACCEPT,
      );
      tl.fromTo(
        keycap,
        Object.assign({ scale: 0.94 }, KEY_DOWN),
        Object.assign({ scale: 1, duration: 0.1, ease: "power3.out", immediateRender: false }, KEY_REST),
        1.85,
      );

      // Scene 4 (1.95-3.6): hold; the footage keeps typing on its own. No exit.
      tl.set({}, {}, 3.6);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
