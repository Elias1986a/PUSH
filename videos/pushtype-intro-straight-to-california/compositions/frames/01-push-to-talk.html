    <!-- The Talk recording, masked to the Notes window, and the Large live pill recorded on

    <!-- approved frame video hoisted by assemble-index -->

  <script>
    (function () {
      var ID = "01-push-to-talk";
      var PREFIX = "f" + ID + "-";
      var byId = function (name) {
        return document.getElementById(PREFIX + name);
      };
      // The approved videos are hoisted to the host root, outside this frame's
      // scoped document, so they are looked up on the real owner document.
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var hostDoc = (root && root.ownerDocument) || window.document;
      var hostVideo = function (name) {
        return hostDoc.getElementById(PREFIX + name) || byId(name);
      };

      var kicker = byId("kicker");
      var words = Array.prototype.slice.call(byId("headline").querySelectorAll("span"));
      var keyRow = byId("key");
      var keycap = byId("keycap");
      var rimWindow = byId("rim-window");
      var talkA = hostVideo("talk-a");
      var pill = hostVideo("pill");

      // Masks in the 1000x750 video box (design space 1040x780 at 0.9615).
      var MASK_WINDOW = "inset(15.385px 20.192px 99.038px 19.231px round 23.077px)";
      // The pill take at 1:1 (1820x192 box at (57, 710)): the pill's x 63-1743, y 120-192
      // lands on screen x 120-1800, y 830-902, under the note.
      var MASK_PILL = "inset(120px 77px 0px 63px round 36px)";
      var FOOTAGE_FILTER = "brightness(1.14)";
      var layerA = { clipPath: MASK_WINDOW, filter: FOOTAGE_FILTER };
      var layerPill = { clipPath: MASK_PILL, filter: FOOTAGE_FILTER };
      if (talkA) Object.assign(talkA.style, { clipPath: MASK_WINDOW, filter: FOOTAGE_FILTER });
      // Pieces of the window clip split in Studio (ids "<talk-a id>-split…") get the same mask.
      Array.prototype.forEach.call(
        hostDoc.querySelectorAll('video[id^="' + PREFIX + 'talk-a-"]'),
        function (piece) {
          Object.assign(piece.style, { clipPath: MASK_WINDOW, filter: FOOTAGE_FILTER });
        },
      );
      if (pill) Object.assign(pill.style, layerPill);

      var KEY_REST = { borderColor: "rgba(239,237,232,0.22)", boxShadow: "0 0 0px rgba(255,90,69,0)" };
      var KEY_DOWN = { borderColor: "#FF5A45", boxShadow: "0 0 24px rgba(255,90,69,0.35)" };

      // Footage cues (frame-local seconds).
      var PILL_CLOSES = 2.65;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.7): the product window rises into place, pill layer with it.
      var rise = function (target, extra) {
        if (!target) return;
        tl.fromTo(
          target,
          Object.assign({ y: 40, opacity: 0 }, extra || {}),
          Object.assign({ y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, extra || {}),
          0,
        );
      };
      rise(rimWindow);
      rise(talkA, layerA);
      rise(pill, layerPill);

      // Kicker fades up at 0.15.
      tl.fromTo(
        kicker,
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.15,
      );

      // Scene 2 (0.25-1.1): "PUSH", "to", "talk." land word by word.
      var WORD_START = 0.25;
      var WORD_STAGGER = 0.12;
      var WORD_DUR = 0.6;
      var wordTimes = words.map(function (_, i) {
        return WORD_START + i * WORD_STAGGER;
      });
      words.forEach(function (word, i) {
        tl.fromTo(
          word,
          { y: 30, opacity: 0 },
          { y: 0, opacity: 1, duration: WORD_DUR, ease: "power3.out" },
          wordTimes[i],
        );
      });

      // Scene 3 (1.0-2.65): key cap enters, then goes straight down and holds.
      tl.fromTo(
        keyRow,
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        1.0,
      );
      var PRESS_START = 1.25;
      var PRESS_DUR = 0.15;
      tl.fromTo(
        keycap,
        Object.assign({ scale: 1 }, KEY_REST),
        Object.assign({ scale: 0.94, duration: PRESS_DUR, ease: "power1.in" }, KEY_DOWN),
        PRESS_START,
      );

      // Scene 4 (2.65-3.6): the key releases and the pill closes; the text lands at 3.07.
      tl.to(
        keycap,
        Object.assign({ scale: 1, duration: 0.25, ease: "power3.out" }, KEY_REST),
        PILL_CLOSES,
      );
      if (pill) tl.to(pill, { opacity: 0, duration: 0.15, ease: "power1.out" }, PILL_CLOSES);

      // Hold still to the cut: the clean text lands in the note at 3.07 on its own and
      // stays on screen for two seconds so it can be read.
      tl.set({}, {}, 5.6);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
