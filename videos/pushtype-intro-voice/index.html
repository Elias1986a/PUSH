    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });

      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-tab-to-type", { opacity: 0, duration: 0.3, ease: "power2.out" }, 12.2);
        tl.fromTo("#el-03-end-card", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 12.2);

        tl.fromTo("#f02-tab-to-type-type-a", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 12.2);
