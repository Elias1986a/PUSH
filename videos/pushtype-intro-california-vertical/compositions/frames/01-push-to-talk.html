    <!-- The live pill (promo/pill-large.mp4's ProRes master, cut to assets/footage/pill-clip.mp4)

  </div>

  <script>
    (function () {
      var ID = "01-push-to-talk";
      var PREFIX = "f" + ID + "-";
      var byId = function (name) {
        return document.getElementById(PREFIX + name);
      };
      // The pill video sits on the host root, outside this frame's scoped document.
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var hostDoc = (root && root.ownerDocument) || window.document;

      var kicker = byId("kicker");
      var words = Array.prototype.slice.call(byId("headline").querySelectorAll("span"));
      var keyRow = byId("key");
      var keycap = byId("keycap");
      var pill = hostDoc.getElementById(PREFIX + "pill");

      // The 1820x192 pill take at 1.5 (2730 x 288 box at (-1654.5, 906)): source
      // x 1143-1743 lands on screen x 60-960, the pill's y 120-192 on y 1086-1194.
      // Its left edge is a cut, so it fades out over 150px.
      var MASK_PILL = "inset(180px 115.5px 0px 1714.5px round 54px)";
      var FADE = "linear-gradient(to right, transparent 1714.5px, #000 1864.5px)";
      var FOOTAGE_FILTER = "brightness(1.14)";
      if (pill) {
        Object.assign(pill.style, {
          clipPath: MASK_PILL,
          maskImage: FADE,
          webkitMaskImage: FADE,
          filter: FOOTAGE_FILTER,
          transformOrigin: "2164.5px 234px",
        });
      }

      var KEY_REST = { borderColor: "rgba(239,237,232,0.22)", boxShadow: "0 0 0px rgba(255,90,69,0)" };
      var KEY_DOWN = { borderColor: "#FF5A45", boxShadow: "0 0 24px rgba(255,90,69,0.35)" };

      // Cues (frame-local seconds). Jessica speaks 0.14-2.73; the key comes up as she ends.
      var KEY_UP = 2.65;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.5): kicker, "PUSH to talk." word by word, the key row and the pill.
      tl.fromTo(kicker, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
      words.forEach(function (word, i) {
        tl.fromTo(word, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.05 + i * 0.06);
      });
      tl.fromTo(keyRow, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.1);
      if (pill) {
        tl.fromTo(pill, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
        // A slow push-in while she talks; at 1.0 the pill fills the safe column exactly.
        tl.fromTo(pill, { scale: 0.96 }, { scale: 1, duration: 2.7, ease: "sine.out" }, 0.05);
      }

      // Scene 2 (0.15-2.65): the key goes down before she speaks and holds.
      tl.fromTo(
        keycap,
        Object.assign({ scale: 1 }, KEY_REST),
        Object.assign({ scale: 0.94, duration: 0.12, ease: "power1.in" }, KEY_DOWN),
        0.15,
      );

      // Scene 3 (2.65): the key comes up as she finishes; the sunset wipes up from 2.75 (frame 1b).
      tl.to(keycap, Object.assign({ scale: 1, duration: 0.25, ease: "power3.out" }, KEY_REST), KEY_UP);

      tl.set({}, {}, 3.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
