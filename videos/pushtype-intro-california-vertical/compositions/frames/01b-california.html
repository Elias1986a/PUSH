  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="01b-california"]');
      var q = function (id) { return root.querySelector('#f01b-california-' + id); };
      var panel = q('panel');
      var palm = q('palm');
      var eyebrow = q('eyebrow');
      var title = q('title');
      var card = q('card');
      var gap = q('gap');
      var like = q('like');
      var strike = q('strike');
      var track = q('track');
      var knob = q('knob');
      var labelOff = q('label-off');
      var labelOn = q('label-on');

      // Cues (frame-local seconds). The frame starts as she stops talking, so
      // the card is the first place her sentence is seen: it gets a full read
      // before the switch flips. The frame's last 0.4 s are the exit wipe.
      var SWITCH_ON = 2.0;
      var STRIKE = 2.25;
      var LIKE_OUT = 2.45;

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.45): the sunset wipes up over the note, covering it
      // before her text lands there (0.45 s in).
      tl.fromTo(panel,
        { clipPath: 'inset(100% 0% 0% 0% round 40px 40px 0px 0px)' },
        { clipPath: 'inset(0% 0% 0% 0% round 0px 0px 0px 0px)', duration: 0.45, ease: 'power3.inOut' },
        0);

      // Scene 2 (0.25–0.95): title, palm, then the card with her sentence as she said it.
      tl.fromTo(eyebrow, { y: 24, opacity: 0 }, { y: 0, opacity: 0.8, duration: 0.5, ease: 'power3.out' }, 0.25);
      tl.fromTo(title, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.3);
      tl.fromTo(palm, { y: 80 }, { y: 0, duration: 0.8, ease: 'power3.out' }, 0.2);
      tl.fromTo(card, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.45);
      tl.set(labelOn, { opacity: 0 }, 0);

      // Scene 3 (2.0): the switch flips ON, like the site's.
      tl.fromTo(knob,
        { x: 0, backgroundColor: '#2a1b3d' },
        { x: 54, backgroundColor: '#ffffff', duration: 0.3, ease: 'power3.out', immediateRender: false },
        SWITCH_ON);
      tl.fromTo(track,
        { backgroundColor: '#ffffff' },
        { backgroundColor: '#ff7a5c', duration: 0.3, ease: 'power3.out', immediateRender: false },
        SWITCH_ON);
      tl.set(labelOff, { opacity: 0 }, SWITCH_ON + 0.1);
      tl.set(labelOn, { opacity: 1 }, SWITCH_ON + 0.1);

      // Scene 4 (2.25–2.9): "like" is struck through, lifts away, and the words close up.
      tl.fromTo(strike, { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: 'power2.out' }, STRIKE);
      tl.fromTo(like,
        { y: 0, opacity: 1, scale: 1, filter: 'blur(0px)' },
        { y: -28, opacity: 0, scale: 0.8, filter: 'blur(4px)', duration: 0.3, ease: 'power3.in', immediateRender: false },
        LIKE_OUT);
      tl.fromTo(gap,
        { maxWidth: 170 },
        { maxWidth: 0, duration: 0.4, ease: 'power3.inOut', immediateRender: false },
        LIKE_OUT + 0.05);

      // Scene 5 (2.9–3.25): hold the clean sentence.
      // Exit (3.25–3.65): the sunset wipes away upward, the way it came in, and
      // reveals Tab to TYPE underneath (a wipe, so no text dissolves into text).
      var EXIT = 3.25;
      tl.fromTo(panel,
        { clipPath: 'inset(0% 0% 0% 0% round 0px 0px 0px 0px)' },
        { clipPath: 'inset(0% 0% 100% 0% round 0px 0px 40px 40px)', duration: 0.4, ease: 'power3.in', immediateRender: false },
        EXIT);
      tl.fromTo([eyebrow, title, card],
        { y: 0 },
        { y: -60, duration: 0.4, ease: 'power3.in', immediateRender: false },
        EXIT);
      tl.set({}, {}, 3.65);

      window.__timelines = window.__timelines || {};
      window.__timelines["01b-california"] = tl;
    })();
