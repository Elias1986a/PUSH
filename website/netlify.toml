# Read when website/ is the base directory, which it is (see ../netlify.toml).
# Headers live here, not in ../netlify.toml: Netlify reads only this file,
# so the headers placed there never reached a response.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # No inline scripts anywhere (they live in assets/*.js). Style attributes
    # are still inline, hence 'unsafe-inline' for styles only. Umami's script
    # comes from cloud.umami.is and reports to gateway.umami.is. The Meta
    # Pixel loads from connect.facebook.net and reports to www.facebook.com.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cloud.umami.is https://connect.facebook.net; connect-src 'self' https://cloud.umami.is https://gateway.umami.is https://www.facebook.com; img-src 'self' data: https://www.facebook.com; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

# Fonts never change under the same name. Video, images and scripts change
# rarely; a day keeps repeat visits cheap without pinning an old copy.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify's own hostnames serve the same site, so once the site is indexable
# they would be duplicate copies.  Send them to the real domain.  Deploy
# previews (deploy-preview-N--) are a different host and keep working.
[[redirects]]
  from = "https://pushtype.netlify.app/*"
  to = "https://pushtype.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--pushtype.netlify.app/*"
  to = "https://pushtype.app/:splat"
  status = 301
  force = true
